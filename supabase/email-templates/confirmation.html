<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm your MatchUp email address</title>
</head>
<body style="margin:0;padding:0;background:#05060f;font-family:Arial,Helvetica,sans-serif;color:#ffffff;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#05060f;">
    <tr><td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:560px;background:#0d0e20;border:1px solid #28263f;border-radius:24px;overflow:hidden;">
        <tr><td style="padding:28px 28px 18px;background:linear-gradient(135deg,#11152b,#17112a);">
          <a href="https://match-up-ten.vercel.app/" style="text-decoration:none;color:#ffffff;font-size:25px;font-weight:800;letter-spacing:-1px;">
            <img src="https://match-up-ten.vercel.app/icon.svg" width="34" height="34" alt="MatchUp" style="vertical-align:middle;border:0;border-radius:9px;margin-right:10px;">
            MatchUp
          </a>
        </td></tr>
        <tr><td style="padding:36px 28px 34px;">
          <div style="font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#aa7aff;">MatchUp</div>
          <h1 style="margin:10px 0 14px;font-size:32px;line-height:1.12;letter-spacing:-1px;color:#ffffff;">Confirm your email address</h1>
          <p style="margin:0 0 10px;font-size:16px;line-height:1.6;color:#d6d2df;">Welcome to MatchUp.</p>
          <p style="margin:0;font-size:15px;line-height:1.7;color:#a8a4b5;">Please confirm your email address to finish creating your MatchUp account.</p>
          <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin-top:28px;"><tr><td style="border-radius:14px;background:#7c35f5;">
            <a href="https://match-up-ten.vercel.app/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email" style="display:inline-block;padding:15px 22px;border-radius:14px;color:#ffffff;text-decoration:none;font-size:14px;font-weight:800;">Confirm my MatchUp email</a>
          </td></tr></table>
          <p style="margin:28px 0 0;font-size:12px;line-height:1.7;color:#77738b;">If you did not create a MatchUp account, you can safely ignore this email.</p>
        </td></tr>
        <tr><td style="padding:20px 28px 26px;border-top:1px solid #28263f;color:#77738b;font-size:12px;line-height:1.7;">
          <strong style="color:#bcb7c8;">MatchUp</strong><br>Football. Competition. Community.<br><br>© MatchUp
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
