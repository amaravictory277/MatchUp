name: Apply Social Redesign v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.head_commit.message != 'feat: apply social chat and avatar refinements v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch existing source
        env:
          PATCH_B64: "" 
        run: |
          echo "$PATCH_B64" | base64 -d > /tmp/patch.py
          # The full patch script is injected below by the repository's patch step.
          python /tmp/patch.py
