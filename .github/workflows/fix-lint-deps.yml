name: Fix lint dependencies

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'matchup-ci'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned ESLint dependencies
        run: npm install --save-dev eslint@8.57.1 eslint-config-next@15.1.6
      - name: Commit dependency fix
        run: |
          git config user.name "matchup-ci"
          git config user.email "matchup-ci@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Add ESLint dependencies"
          git push
