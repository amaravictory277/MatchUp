name: Fix chat relation hints

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Disambiguate chat profile relations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          updated = re.sub(r'(from\("chat_messages"\)\.select\("[^\n]*?)profiles\(id,display_name,username\)', r'\1profiles!chat_messages_sender_id_fkey(id,display_name,username)', s)
          updated = updated.replace('from("chat_group_members").select("group_id,user_id,profiles!chat_messages_sender_id_fkey(id,display_name,username)")', 'from("chat_group_members").select("group_id,user_id,profiles(id,display_name,username)")')
          updated = updated.replace('from("chat_group_members").select("user_id,profiles!chat_messages_sender_id_fkey(id,display_name,username)")', 'from("chat_group_members").select("user_id,profiles(id,display_name,username)")')
          if updated != s:
              p.write_text(updated)
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- components/chat/chat-hub.tsx; then
            echo "No chat relation changes needed"
            exit 0
          fi
          git config user.name "matchup-ci"
          git config user.email "matchup-ci@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git commit -m "Fix chat profile relationship queries"
          git push
