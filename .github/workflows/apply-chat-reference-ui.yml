name: Apply chat reference UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rendered ChatHub
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/chat/chat-hub.tsx')
          s=p.read_text()
          s=s.replace('import { SidebarSectionCard } from "./sidebar-section-card";','import { SidebarSectionCard } from "./sidebar-section-card";\nimport { MatchUpAvatar } from "../ui/matchup-avatar";')
          s=s.replace('type Profile={id:string;display_name?:string|null;username?:string|null};','type Profile={id:string;display_name?:string|null;username?:string|null;avatar_path?:string|null};')
          s=s.replace('const [showRooms,setShowRooms]=useState(false);','const [showRooms,setShowRooms]=useState(false);const [roomTab,setRoomTab]=useState<"recent"|"seen">("recent");')
          s=s.replace('select("id,display_name,username")','select("id,display_name,username,avatar_path")')
          old='''<div className="min-w-0 flex-1"><div className="flex items-center gap-2"><div className="grid size-9 shrink-0 place-items-center overflow-hidden rounded-xl bg-[#0b3154]">{activeImage?<img src={activeImage} alt="" className="size-full object-cover"/>:<Users size={17} className="text-[#70c1ff]"/>}</div><div className="min-w-0"><h1 className="truncate text-base font-black">{activeLabel}</h1><p className="text-[11px] text-[#7892ac]">{active?.kind==="general"?`${presence.length} online`:active?.kind==="group"?`${members.length} members`:"Private message"}</p></div></div></div>'''
          new='''<div className="min-w-0 flex-1"><div className="flex min-w-0 items-center gap-3"><div className="flex min-w-0 items-center gap-2">{active?.kind==="group"&&members.length?<div className="flex shrink-0 items-center pl-1">{members.slice(0,5).map((m,i)=><div key={m.id} className={`relative size-8 overflow-hidden rounded-full border-2 border-[#08182b] ${i?"-ml-2":""}`}><MatchUpAvatar profile={m} size="sm" className="size-full rounded-full"/></div>)}</div>:<div className="grid size-9 shrink-0 place-items-center overflow-hidden rounded-xl bg-[#0b3154]">{activeImage?<img src={activeImage} alt="" className="size-full object-cover"/>:<Users size={17} className="text-[#70c1ff]"/>}</div>}<div className="min-w-0"><h1 className="truncate text-base font-black">{activeLabel}</h1><p className="text-[11px] text-[#7892ac]">{active?.kind==="general"?`${presence.length} online`:active?.kind==="group"?`${members.length} members`:"Private message"}</p></div></div>{active?.kind==="group"?<button type="button" onClick={()=>{setGroupName(active.name);setInviteSearch("");setInviteCandidates(friends);setShowManage(true);}} className="shrink-0 rounded-xl bg-[#1674cf] px-3 py-2 text-[11px] font-black text-white shadow-[0_5px_14px_rgba(0,0,0,.18)]">Invite</button>:null}</div></div>'''
          if old not in s: raise SystemExit('header block not found')
          s=s.replace(old,new,1)
          start=s.index('{showRooms?<aside')
          end=s.index('</aside>:null}',start)+len('</aside>:null}')
          newrooms='''{showRooms?<aside className="fixed inset-0 z-[60] flex h-[100dvh] w-full flex-col overflow-y-auto border-[#18365f] bg-[#08182b] p-4 shadow-2xl sm:absolute sm:inset-x-0 sm:top-[73px] sm:z-30 sm:h-auto sm:max-h-[calc(72vh-73px)] sm:w-auto sm:border-b"><div className="mb-4 flex items-center justify-between"><div><p className="text-xs font-black uppercase tracking-[.14em] text-[#47a8ff]">Chats</p><p className="mt-1 text-[10px] text-[#66809a]">Private messages and groups</p></div><button type="button" onClick={()=>setShowRooms(false)}><X size={17}/></button></div><div className="mb-5 grid grid-cols-2 rounded-2xl bg-[#071426] p-1"><button type="button" onClick={()=>setRoomTab("recent")} className={`rounded-xl px-3 py-2 text-xs font-black ${roomTab==="recent"?"bg-[#1674cf] text-white":"text-[#7892ac]"}`}>Recent</button><button type="button" onClick={()=>setRoomTab("seen")} className={`rounded-xl px-3 py-2 text-xs font-black ${roomTab==="seen"?"bg-[#1674cf] text-white":"text-[#7892ac]"}`}>Seen</button></div>{roomTab==="seen"?<div className="rounded-2xl border border-[#18365f] bg-[#071426] p-5 text-center"><p className="text-sm font-bold">All caught up</p><p className="mt-1 text-xs text-[#7892ac]">Seen conversations will appear here.</p></div>:<><p className="mb-2 text-[10px] font-black uppercase tracking-[.14em] text-[#66809a]">PRIVATE MESSAGES</p><div className="space-y-1">{privateChats.length?privateChats.slice(0,8).map(pc=><button key={pc.group.id} type="button" onClick={()=>{setActive(pc.group);setShowRooms(false);}} className={`flex w-full items-center gap-3 rounded-2xl p-3 text-left ${active?.id===pc.group.id?"bg-[#0b3154]":"hover:bg-[#0a1d32]"}`}><MatchUpAvatar profile={pc.friend} size="sm" className="size-11 rounded-2xl"/><span className="min-w-0 flex-1"><strong className="block truncate text-sm">{nameOf(pc.friend)}</strong><small className="block truncate text-[11px] text-[#7892ac]">@{pc.friend.username||"friend"}</small></span><span className="text-[10px] text-[#66809a]">{active?.id===pc.group.id?"Open":""}</span></button>):<p className="rounded-2xl border border-[#18365f] bg-[#071426] p-3 text-xs text-[#7892ac]">No private conversations yet.</p>}</div><div className="mt-6"><div className="mb-2 flex items-center justify-between"><p className="text-[10px] font-black uppercase tracking-[.14em] text-[#66809a]">GROUPS &amp; CHANNELS</p><button type="button" onClick={()=>{setShowCreate(true);setShowRooms(false);}} className="grid size-7 place-items-center rounded-full bg-[#1674cf] text-white" aria-label="Create group"><Plus size={15}/></button></div><button type="button" onClick={()=>{if(general){setActive(general);setShowRooms(false);}}} className={`mb-1 flex w-full items-center gap-3 rounded-2xl p-3 text-left ${active?.kind==="general"?"bg-[#0b3154]":"hover:bg-[#0a1d32]"}`}><span className="grid size-10 shrink-0 place-items-center rounded-xl bg-[#126bc0]"><Users size={18}/></span><span className="min-w-0 flex-1"><strong className="block text-sm">General</strong><small className="text-[11px] text-[#7892ac]">Global MatchUp chat</small></span><span className="text-[#66809a]">›</span></button>{groups.length?groups.slice(0,8).map(g=><button key={g.id} type="button" onClick={()=>{setActive(g);setShowRooms(false);}} className={`flex w-full items-center gap-3 rounded-2xl p-3 text-left ${active?.id===g.id?"bg-[#0b3154]":"hover:bg-[#0a1d32]"}`}><span className="grid size-10 shrink-0 place-items-center overflow-hidden rounded-2xl bg-[#103a60]">{g.image_path?<img src={supabase.storage.from("chat-media").getPublicUrl(g.image_path).data.publicUrl} alt="" className="size-full object-cover"/>:<Users size={17} className="text-[#70c1ff]"/>}</span><span className="min-w-0 flex-1"><strong className="block truncate text-sm">{g.name}</strong><small className="block truncate text-[11px] text-[#7892ac]">{g.locked?"Locked group":"Group"}</small></span><span className="text-[#66809a]">›</span></button>):<p className="rounded-2xl border border-[#18365f] bg-[#071426] p-3 text-xs text-[#7892ac]">No groups yet.</p>}</div></>}</aside>:null}'''
          s=s[:start]+newrooms+s[end:]
          s=s.replace('<div className="matchup-chat-body flex-1 overflow-y-auto bg-[#061221] px-3 py-4 sm:px-5">','<div className="matchup-chat-body flex-1 overflow-y-auto bg-[#061221] px-3 py-4 sm:px-5" style={{backgroundImage:"radial-gradient(circle at 20% 20%, rgba(44,108,164,.07) 0 1px, transparent 1px), radial-gradient(circle at 80% 70%, rgba(44,108,164,.05) 0 1px, transparent 1px)",backgroundSize:"42px 42px,58px 58px"}}>')
          oldmsg='''return <div key={m.id} data-message-id={m.id} className={`mb-3 flex ${own?"justify-end":"justify-start"}`}><div className={`max-w-[84%] sm:max-w-[72%] rounded-[22px] px-4 py-3 transition ${own?"matchup-chat-bubble-own rounded-br-[7px] bg-[#126bc0]":"matchup-chat-bubble-other rounded-bl-[7px] border border-[#173d67] bg-[#0a1b2f]"}'''
          newmsg='''return <div key={m.id} data-message-id={m.id} className={`mb-3 flex ${own?"justify-end":"justify-start"}`}>{!own?<div className="mr-2 mt-auto size-8 shrink-0 overflow-hidden rounded-full"><MatchUpAvatar profile={profile(m.profiles)} size="sm" className="size-full rounded-full"/></div>:null}<div className={`max-w-[84%] sm:max-w-[72%] rounded-[22px] px-4 py-3 transition ${own?"matchup-chat-bubble-own rounded-br-[7px] bg-[#126bc0]":"matchup-chat-bubble-other rounded-bl-[7px] border border-[#173d67] bg-[#0a1b2f]"}'''
          if oldmsg not in s: raise SystemExit('message block not found')
          s=s.replace(oldmsg,newmsg,1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'feat: refine chat reference design'
          git push origin main
