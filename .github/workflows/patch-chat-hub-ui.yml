name: Apply chat hub UI source patch

on:
  push:
    branches: [main]
    paths:
      - "scripts/patch-chat-hub-ui.mjs"
      - ".github/workflows/patch-chat-hub-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch ChatHub source
        run: node scripts/patch-chat-hub-ui.mjs
      - name: Commit patched ChatHub
        run: |
          if git diff --quiet; then
            echo "ChatHub is already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git commit -m "fix(chat): update rendered chat hub UI"
          git push
      # retrigger source patch after the initial workflow was added
