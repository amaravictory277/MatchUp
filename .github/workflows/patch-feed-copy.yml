name: Patch feed composer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'matchup-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feed copy and text-only normal post rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('components/feeds/create-hub.tsx')
          s = p.read_text().replace('Get noticed and earn.', 'Share your squad or gameplay with the community.')
          p.write_text(s)

          p = Path('components/feeds/data.ts')
          s = p.read_text().replace('subtitle:"Talk. Share. Connect."', 'subtitle:"Share a quick text update with the community."')
          p.write_text(s)

          p = Path('components/feeds/feeds-client.tsx')
          s = p.read_text()
          old = 'const text=composerText.trim();if(!text&&!files.length){notify("Add text or media before posting");return;}'
          new = 'const text=composerText.trim();const textOnly=composer.id==="normal-post";if(textOnly&&files.length){notify("Normal posts are text-only. Remove the media to continue.");return;}if(!text&&!files.length){notify(textOnly?"Write something before posting":"Add text or media before posting");return;}'
          if old not in s:
              raise SystemExit('submitComposer text validation anchor not found')
          s = s.replace(old, new, 1)

          pattern = re.compile(r'<label className="mt-3 flex cursor-pointer.*?<p className="mt-2 text-\[11px\] text-\[#66809a\]">Up to 10 photos, or one video up to 60 seconds\.</p>', re.S)
          replacement = '''{composer.id!=="normal-post"?<><label className="mt-3 flex cursor-pointer items-center gap-3 rounded-2xl border border-dashed border-[#245b91] bg-[#071426] p-4 text-sm text-[#a9bdd5]"><span className="flex-1">Add photos or a video</span><span className="text-xs font-bold text-[#70c1ff]">{files.length?`${files.length} selected`:"Choose"}</span><input type="file" accept="image/*,video/*" multiple className="hidden" onChange={e=>chooseFiles(e.target.files)}/></label>{files.length?<div className="mt-3 flex flex-wrap gap-2">{files.map((f,i)=><span key={`${f.name}-${i}`} className="max-w-full rounded-full border border-[#18365f] bg-[#0a1b2f] px-3 py-1.5 text-xs text-[#b7c9da]">{f.name}</span></div>:null}<p className="mt-2 text-[11px] text-[#66809a]">Up to 10 photos, or one video up to 60 seconds.</p></>:<p className="mt-3 rounded-2xl border border-[#18365f] bg-[#071426] p-3.5 text-xs leading-5 text-[#7892ac]">Text-only post. Share your thoughts, an update, or something you want the community to see.</p>}'''
          if not pattern.search(s):
              raise SystemExit('media composer block not found')
          s = pattern.sub(replacement, s, count=1)
          p.write_text(s)
          PY

          git config user.name "matchup-bot"
          git config user.email "actions@github.com"
          git add components/feeds/create-hub.tsx components/feeds/data.ts components/feeds/feeds-client.tsx
          git commit -m "fix: make normal feed posts text only and improve copy"
          git push
