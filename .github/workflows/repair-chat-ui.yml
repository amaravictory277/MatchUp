name: Repair Chat UI
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-chat-ui.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch actual ChatHub source
        run: |
          git fetch origin 2bfb414de121378f17cddb87e6ff210618891b35
          git checkout 2bfb414de121378f17cddb87e6ff210618891b35 -- components/chat/chat-hub.tsx
          node <<'NODE'
          const fs = require('fs');
          const path = 'components/chat/chat-hub.tsx';
          let src = fs.readFileSync(path, 'utf8');
          const returnIndex = src.lastIndexOf('return ');
          if (returnIndex < 0) throw new Error('ChatHub render return not found');
          const prefix = src.slice(0, returnIndex);
          const tail = src.slice(returnIndex);
          const rootMatch = tail.match(/<div className="([^"]+)"/);
          if (!rootMatch) throw new Error('ChatHub render root not found');
          const classes = rootMatch[1].split(/\s+/).filter(Boolean).filter(c => !/^max-w-/.test(c) && c !== 'mx-auto' && c !== 'w-screen');
          for (const c of ['w-full','max-w-none','min-w-0','overflow-x-hidden']) if (!classes.includes(c)) classes.push(c);
          src = prefix + tail.slice(0, rootMatch.index) + `<div className="${classes.join(' ')}"` + tail.slice(rootMatch.index + rootMatch[0].length);
          fs.writeFileSync(path, src);
          const cardPath = 'components/chat/sidebar-section-card.tsx';
          let card = fs.readFileSync(cardPath, 'utf8').replace('rounded-2xl border border-[#214a78]', 'rounded-xl border border-[#214a78]');
          fs.writeFileSync(cardPath, card);
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx components/chat/sidebar-section-card.tsx
          git commit -m 'fix(chat): repair full width chat layout'
          git push