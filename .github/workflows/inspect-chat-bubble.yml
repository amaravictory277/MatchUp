name: Inspect Chat Bubble

on:
  push:
    paths:
      - .github/workflows/inspect-chat-bubble.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect outgoing message markup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          lines = p.read_text().splitlines()
          for i, line in enumerate(lines):
              if any(x in line for x in ['CheckCheck', 'Check', 'rounded', 'message', 'readState', 'isMine']):
                  if i > 0:
                      print(f'--- {i+1} ---')
                      for j in range(max(0, i-5), min(len(lines), i+8)):
                          print(f'{j+1}: {lines[j]}')
          PY
