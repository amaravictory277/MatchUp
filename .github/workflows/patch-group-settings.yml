name: Patch ChatHub Group Settings

on:
  push:
    paths:
      - '.github/workflows/patch-group-settings.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect ChatHub
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('components/chat/chat-hub.tsx').read_text()
          for needle in ['Settings2', 'Group settings', 'showManage']:
              i = s.find(needle)
              print(f'--- {needle} at {i} ---')
              if i >= 0:
                  print(s[max(0,i-900):i+900])
          PY
