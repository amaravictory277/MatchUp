name: Fix and verify chat build

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-build:
    if: github.event.head_commit.message != 'fix: harden chat message state and emoji detection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply safe chat fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          s = s.replace('const EMOJI_ONLY = /^(?:[\\u{1F1E6}-\\u{1F1FF]{2}|[\\p{Extended_Pictographic}\\uFE0F\\u200D])+(?:\\s*)$/u;', 'const EMOJI_ONLY = /^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}|\\uFE0F|\\u200D|\\s)+$/u;')
          s = s.replace('const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString(), body: "", sticker_key: null }).eq("id", message.id);', 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString() }).eq("id", message.id);')
          s = s.replace('  ArrowLeft,\n', '').replace('  Heart,\n', '').replace('  Link2,\n', '')
          p.write_text(s)
          PY
          npm ci
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          git commit -m 'fix: harden chat message state and emoji detection'
          git push origin main
