name: Inspect ChatHub (temporary)
on:
  push:
    branches: [main]
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested chat layout changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('components/chat/chat-hub.tsx')
          s=p.read_text()

          old='const channelRef=useRef<ReturnType<typeof supabase.channel>|null>(null);const typingTimer=useRef<ReturnType<typeof setTimeout>|null>(null);const bottomRef=useRef<HTMLDivElement|null>(null);const inputRef=useRef<HTMLInputElement|null>(null);'
          new=old+'const [headerVisible,setHeaderVisible]=useState(true);const [keyboardOffset,setKeyboardOffset]=useState(0);const chatBodyRef=useRef<HTMLDivElement|null>(null);'
          if old not in s: raise SystemExit('state anchor not found')
          s=s.replace(old,new,1)

          old=' useEffect(()=>{if(!active)return;void loadGroup(active);setHighlighted("");'
          new=' useEffect(()=>{const body=chatBodyRef.current;if(!body)return;let last=body.scrollTop;const onScroll=()=>{const current=body.scrollTop;if(current<=4){setHeaderVisible(true);}else if(current>last+1){setHeaderVisible(false);}else if(current<last-1){setHeaderVisible(true);}last=current;};body.addEventListener("scroll",onScroll,{passive:true});return()=>body.removeEventListener("scroll",onScroll);},[active]);useEffect(()=>{const vv=window.visualViewport;if(!vv)return;const update=()=>{const offset=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);setKeyboardOffset(offset);};update();vv.addEventListener("resize",update);vv.addEventListener("scroll",update);return()=>{vv.removeEventListener("resize",update);vv.removeEventListener("scroll",update);};},[]);'+old
          if old not in s: raise SystemExit('effect anchor not found')
          s=s.replace(old,new,1)

          s=s.replace('return <section className="matchup-chat relative min-h-[72vh] overflow-hidden rounded-[28px]', 'return <section className="matchup-chat relative h-[100dvh] min-h-0 overflow-hidden rounded-[28px]',1)
          s=s.replace('<div className="flex min-h-[72vh] flex-col">', '<div className="flex h-full min-h-0 flex-col">',1)
          old='<header className="matchup-chat-header border-b border-[#18365f] bg-[#08182b] px-3 py-3 sm:px-5">'
          new='<header className={`matchup-chat-header border-b border-[#18365f] bg-[#08182b] px-3 py-3 sm:px-5 overflow-hidden transition-[max-height,transform,opacity] duration-200 ${headerVisible?"max-h-24 translate-y-0 opacity-100":"max-h-0 -translate-y-full opacity-0 pointer-events-none"}`}>'
          if old not in s: raise SystemExit('header anchor not found')
          s=s.replace(old,new,1)
          old='<div className="matchup-chat-body flex-1 overflow-y-auto bg-[#061221] px-3 py-4 sm:px-5"'
          new='<div ref={chatBodyRef} className="matchup-chat-body min-h-0 flex-1 overflow-y-auto bg-[#061221] px-3 py-4 sm:px-5"'
          if old not in s: raise SystemExit('body anchor not found')
          s=s.replace(old,new,1)
          old='<div className="matchup-chat-composer border-t border-[#18365f] bg-[#08182b] p-3 sm:p-4">'
          new='<div className="matchup-chat-composer sticky bottom-0 z-20 shrink-0 border-t border-[#18365f] bg-[#08182b] p-3 sm:p-4" style={keyboardOffset?{transform:`translateY(-${keyboardOffset}px)`}:undefined}>'
          if old not in s: raise SystemExit('composer anchor not found')
          s=s.replace(old,new,1)

          old='function profile(v:Profile|Profile[]|null|undefined){return Array.isArray(v)?v[0]||null:v||null;}function groupOf'
          new='function profile(v:Profile|Profile[]|null|undefined){return Array.isArray(v)?v[0]||null:v||null;}function profileAccent(v:Profile|Profile[]|null|undefined){const p=profile(v);const palettes=["#43a8ff","#35c58a","#ffb454","#c87cff","#48d1e5"];const key=p?.id||p?.avatar_path||"matchup-default";let h=0;for(let i=0;i<key.length;i++)h=(h*31+key.charCodeAt(i))|0;return palettes[Math.abs(h)%palettes.length];}function groupOf'
          if old not in s: raise SystemExit('profile anchor not found')
          s=s.replace(old,new,1)

          old='function nameOf(v:Profile|Profile[]|null|undefined,fallback="Member"){const p=profile(v);return p?.display_name||p?.username||fallback;}function timeOf(v:string){const d=new Date(v);const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(mins<1)return "Just now";if(mins<60)return `${mins}m`;const hrs=Math.floor(mins/60);if(hrs<24)return `${hrs}h`;const days=Math.floor(hrs/24);if(days===1)return "Yesterday";return `${days}d`;}function exactTime'
          new='function nameOf(v:Profile|Profile[]|null|undefined,fallback="Member"){const p=profile(v);return p?.display_name||p?.username||fallback;}function timeOf(v:string){const d=new Date(v);const mins=Math.max(0,Math.floor((Date.now()-d.getTime())/60000));if(mins<1)return "Just now";if(mins<60)return `${mins} minute${mins===1?"":"s"} ago`;const hrs=Math.floor(mins/60);if(hrs<24)return `${hrs} hour${hrs===1?"":"s"} ago`;const days=Math.floor(hrs/24);if(days===1)return "Yesterday";if(days<7)return `${days} days ago`;const weeks=Math.floor(days/7);return `${weeks} week${weeks===1?"":"s"} ago`;}function exactTime'
          if old not in s: raise SystemExit('time anchor not found')
          s=s.replace(old,new,1)

          start=s.find('messages.length?messages.map(m=>{')
          end=s.find(':<div className="grid min-h-[45vh] place-items-center text-center">',start)
          if start<0 or end<0: raise SystemExit('message renderer anchors not found')
          empty_start=end+1
          replacement=r'''messages.length?messages.map(m=>{const own=m.sender_id===user.id;const counts=reactionCounts.get(m.id);const read=readSet.has(m.id);const parent=m.reply_to_id?messages.find(x=>x.id===m.reply_to_id):null;const sender=profile(m.profiles);const accent=profileAccent(sender);const replyPreview=parent?<div className="mb-2 border-l-2 border-[#70c1ff] pl-3 py-1 text-[10px]"><strong className="block">{nameOf(parent.profiles,parent.sender_id===user.id?"You":"Member")}</strong><p className="truncate text-white/60">{parent.body||parent.sticker_key}</p></div>:null;return own?<div key={m.id} data-message-id={m.id} className="mb-3 flex justify-end"><div className="flex max-w-[84%] flex-col items-end sm:max-w-[72%]">{replyPreview}<div className={`rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3 transition ${highlighted===m.id?"ring-2 ring-[#70c1ff] shadow-[0_0_28px_rgba(36,151,255,.35)]":""} ${m.deleted_at?"opacity-60":""}`}>{m.deleted_at?<i className="text-sm">Message deleted</i>:m.sticker_key?<span className="text-5xl">{m.sticker_key}</span>:<p className="whitespace-pre-wrap break-words text-sm leading-6">{m.body}</p>}</div><div className="mt-1 flex items-center justify-end gap-2"><span className="text-[9px] text-white/50">{timeOf(m.created_at)}</span>{!m.pending?<span className={`grid size-5 place-items-center rounded-full border ${read?"border-white bg-white":"border-white/25 bg-transparent"}`} aria-label={read?"Read":"Delivered"}>{read?<CheckCheck size={11} className="text-[#126bc0]"/>:<CheckCheck size={11} className="text-white/45"/>}</span>:<span className="grid size-5 place-items-center rounded-full border border-white/25" aria-label="Sent"><Check size={11} className="text-white/45"/></span>}</div>{counts?.size?<div className="mt-2 flex flex-wrap justify-end gap-1">{Array.from(counts.entries()).map(([emoji,count])=><button key={emoji} type="button" onClick={()=>void toggleReaction(m.id,emoji)} className="rounded-full border border-white/15 bg-black/10 px-2 py-1 text-[10px]">{emoji} {count}</button>)}</div>:null}</div><button type="button" className="ml-1 mt-5 grid size-7 place-items-center rounded-full text-[#4e6b88] hover:bg-[#0b223c]" aria-label="Reply to message" onClick={()=>{setReplyTo(m);inputRef.current?.focus();}}><Reply size={14}/></button></div>:<div key={m.id} data-message-id={m.id} className="mb-4 flex justify-start"><div className="mr-2 mt-0 size-10 shrink-0 overflow-hidden rounded-full"><MatchUpAvatar profile={sender} size="sm" className="size-full rounded-full"/></div><div className="min-w-0 max-w-[84%] sm:max-w-[72%]"><div className="mb-1 flex items-center gap-2"><span className="rounded-md px-1.5 py-0.5 text-sm font-black" style={!sender?.avatar_path?{color:accent,backgroundColor:`${accent}1a`}:undefined}>{nameOf(sender)}</span><span className="text-[10px] text-[#7892ac]">{timeOf(m.created_at)}</span></div><div className={`rounded-[22px] rounded-bl-[7px] border border-[#173d67] bg-[#0a1b2f] px-4 py-3 transition ${highlighted===m.id?"ring-2 ring-[#70c1ff] shadow-[0_0_28px_rgba(36,151,255,.35)]":""} ${m.deleted_at?"opacity-60":""}`}>{replyPreview}{m.deleted_at?<i className="text-sm">Message deleted</i>:m.sticker_key?<span className="text-5xl">{m.sticker_key}</span>:<p className="whitespace-pre-wrap break-words text-sm leading-6">{m.body}</p>}</div>{counts?.size?<div className="mt-2 flex flex-wrap gap-1">{Array.from(counts.entries()).map(([emoji,count])=><button key={emoji} type="button" onClick={()=>void toggleReaction(m.id,emoji)} className="rounded-full border border-white/15 bg-black/10 px-2 py-1 text-[10px]">{emoji} {count}</button>)}</div>:null}</div><button type="button" className="ml-1 mt-5 grid size-7 place-items-center rounded-full text-[#4e6b88] hover:bg-[#0b223c]" aria-label="Reply to message" onClick={()=>{setReplyTo(m);inputRef.current?.focus();}}><Reply size={14}/></button></div>})'''
          s=s[:start]+replacement+s[empty_start:]

          old='<div className="mb-2 flex items-center gap-2 rounded-2xl border border-[#214a78] bg-[#071426] px-3 py-2 text-xs"><Reply size={14} className="text-[#70c1ff]"/><span className="min-w-0 flex-1 truncate">Replying to <strong>{nameOf(replyTo.profiles)}</strong>: {replyTo.body||replyTo.sticker_key}</span><button type="button" onClick={()=>setReplyTo(null)}><X size={15}/></button></div>'
          new='<div className="mb-2 flex items-center gap-2 rounded-2xl border border-[#214a78] bg-[#071426] px-3 py-2 text-xs"><div className="min-w-0 flex-1 border-l-2 border-[#70c1ff] pl-3"><strong className="block">{nameOf(replyTo.profiles)}</strong><span className="block truncate text-white/60">{replyTo.body||replyTo.sticker_key}</span></div><button type="button" onClick={()=>setReplyTo(null)}><X size={15}/></button></div>'
          if old not in s: raise SystemExit('composer reply anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/trigger-chat-hub-inspect.txt
          git add components/chat/chat-hub.tsx .github/workflows/trigger-chat-hub-inspect.txt
          git commit -m "feat: update chat message layout and mobile scrolling" || exit 0
          git push
