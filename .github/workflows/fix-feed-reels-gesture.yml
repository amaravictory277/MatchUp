name: Fix feed Reels gesture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'matchup-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize Reels context and cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/feeds/reels-viewer.tsx');s=p.read_text()
          old='const {data:rows}=await supabase.from("posts").select("id,author_id,body,created_at").eq("media_kind","video").order("created_at",{ascending:false}).limit(100);if(!alive)return;'
          new='const {data:rows}=await supabase.from("posts").select("id,author_id,body,created_at").eq("media_kind","video").order("created_at",{ascending:false}).limit(100);if(!alive)return;const {data:followRows}=uid?await supabase.from("user_follows").select("following_id").eq("follower_id",uid):{data:[]};const followingIds=new Set((followRows||[]).map((f:any)=>f.following_id));'
          if old not in s: raise SystemExit('reels query anchor missing')
          s=s.replace(old,new,1)
          old='setReels(originTab==="following"&&uid?built.filter(r=>r.authorId===uid):built);'
          new='setReels(originTab==="following"&&uid?built.filter(r=>followingIds.has(r.authorId)||r.authorId===uid):built);'
          if old not in s: raise SystemExit('following filter anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/fix-feed-reels-gesture.yml
          git config user.name "matchup-bot"
          git config user.email "actions@github.com"
          git add components/feeds/reels-viewer.tsx
          git commit -m "fix: preserve following reels context and clean up workflow"
          git push
