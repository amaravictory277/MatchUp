name: Fix direct chat navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix direct chat navigation at ChatHub root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch ChatHub route entry
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/chat/chat-hub.tsx')
          source = path.read_text()
          replacements = [
              (
                  'export function ChatHub() {',
                  'export function ChatHub({ initialGroupId }: { initialGroupId?: string }) {',
              ),
              (
                  '  }, [active, supabase]);\n  useEffect(() => {\n    void loadWorkspace();\n  }, [loadWorkspace]);',
                  '  }, [active, initialGroupId, supabase]);\n  useEffect(() => {\n    void loadWorkspace();\n  }, [loadWorkspace]);\n  useEffect(() => {\n    if (!initialGroupId || !user.id) return;\n    let cancelled = false;\n    const openRequestedConversation = async () => {\n      const { data, error: e } = await supabase\n        .from("chat_groups")\n        .select("id,name,created_by,created_at,kind,locked,member_limit,image_path")\n        .eq("id", initialGroupId)\n        .maybeSingle();\n      if (e) {\n        if (!cancelled) setError(e.message);\n        return;\n      }\n      if (!cancelled && data) {\n        setActive(data as Group);\n        setShowRooms(false);\n      }\n    };\n    void openRequestedConversation();\n    return () => { cancelled = true; };\n  }, [initialGroupId, supabase, user.id]);'
              ),
              (
                  '    if (!active && g) setActive(g);',
                  '    if (!active && g && !initialGroupId) setActive(g);',
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of patch target, found {count}: {old[:80]!r}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-direct-chat-navigation.yml
          git add components/chat/chat-hub.tsx
          git commit -m "Fix direct chat navigation at ChatHub root"
          git push