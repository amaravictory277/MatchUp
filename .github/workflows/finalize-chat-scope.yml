name: Final chat source scope verification
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Restore only pre-existing chat source formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          old = '''              entries={friends.slice(0, 2).map((f) => ({
      id: f.id,
      label: nameOf(f),
      secondary: `@${f.username || "friend"}`,
      profile: f,
      onClick: () => void openPrivate(f),
    }))}'''
          new = '''              entries={friends
                .slice(0, 2)
                .map((f) => ({
                  id: f.id,
                  label: nameOf(f),
                  secondary: `@${f.username || "friend"}`,
                  profile: f,
                  onClick: () => void openPrivate(f),
                }))}'''
          if old not in s:
              raise SystemExit('Expected pre-existing malformed formatting was not found')
          p.write_text(s.replace(old, new, 1))
          PY
          npx prettier@3.6.2 --write components/chat/chat-hub.tsx
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit only ChatHub source cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          git diff --cached --check
          git commit -m 'fix: restore chat source scope'
          git push origin HEAD:main
