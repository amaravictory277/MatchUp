name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Harden chat source before build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          bad = 'const EMOJI_ONLY = /^(?:[\\u{1F1E6}-\\u{1F1FF]{2}|[\\p{Extended_Pictographic}\\uFE0F\\u200D])+(?:\\s*)$/u;'
          good = 'const EMOJI_ONLY = /^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}|\\uFE0F|\\u200D|\\s)+$/u;'
          s = s.replace(bad, good)
          bad_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString(), body: "", sticker_key: null }).eq("id", message.id);'
          good_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString() }).eq("id", message.id);'
          s = s.replace(bad_delete, good_delete)
          s = s.replace('  ArrowLeft,\n', '').replace('  Heart,\n', '').replace('  Link2,\n', '')
          presence_bad = 'entries as Presence[]'
          s = s.replace(presence_bad, 'entries as unknown as Presence[]')
          p.write_text(s)
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet -- components/chat/chat-hub.tsx; then
            echo 'No automated source fix was needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add components/chat/chat-hub.tsx
            git commit -m 'fix: harden chat message state and emoji detection'
            git push origin main
          fi
