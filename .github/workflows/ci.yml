name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize generated source before build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('components/chat/chat-hub.tsx'),
              Path('components/home/live-football-feature.tsx'),
              Path('components/match/match-room.tsx'),
              Path('lib/football/server.ts'),
              Path('app/api/football/match-room/route.ts'),
          ]

          for p in files:
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace(r'\`', '`').replace(r'\${', '${')
              p.write_text(s)

          p = Path('components/chat/chat-hub.tsx')
          if p.exists():
              s = p.read_text()
              bad = 'const EMOJI_ONLY = /^(?:[\\u{1F1E6}-\\u{1F1FF]{2}|[\\p{Extended_Pictographic}\\uFE0F\\u200D])+(?:\\s*)$/u;'
              good = 'const EMOJI_ONLY = /^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}|\\uFE0F|\\u200D|\\s)+$/u;'
              s = s.replace(bad, good)
              bad_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString(), body: "", sticker_key: null }).eq("id", message.id);'
              good_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString() }).eq("id", message.id);'
              s = s.replace(bad_delete, good_delete)
              s = s.replace('  ArrowLeft,\n', '').replace('  Heart,\n', '').replace('  Link2,\n', '')
              p.write_text(s)

          p = Path('components/home/live-football-feature.tsx')
          if p.exists():
              s = p.read_text()
              s = s.replace('{ Search, Vote, MessageCircle, Radio }', '{ Search, Vote, MessageCircle, Radio, Trophy }')
              p.write_text(s)

          p = Path('lib/football/server.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace(r'replace(/\\/$/, "")', r'replace(/\/$/, "")')
              if 'export function getServiceRoleConfigured' not in s:
                  marker = 'const POPULAR_LEAGUES = new Map<number, number>([[1,100],[2,98],[39,96],[140,94],[78,92],[135,90],[61,88],[94,84],[88,82],[253,72],[203,70],[179,68],[71,66]]);'
                  addition = marker + '\n\nexport function getServiceRoleConfigured(){ return Boolean(SUPABASE_URL && SUPABASE_SERVICE_ROLE_KEY); }'
                  s = s.replace(marker, addition)
              p.write_text(s)

          p = Path('app/api/football/match-room/route.ts')
          if p.exists():
              s = p.read_text().replace(r'/^\\d{1,20}$/', r'/^\d{1,20}$/')
              p.write_text(s)
          PY
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No automated source fix was needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add components/chat/chat-hub.tsx components/home/live-football-feature.tsx components/match/match-room.tsx lib/football/server.ts app/api/football/match-room/route.ts
            git commit -m 'fix: resolve generated football source errors'
            git push origin main
          fi
