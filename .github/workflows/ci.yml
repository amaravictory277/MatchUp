name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Harden chat source before build
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          bad = 'const EMOJI_ONLY = /^(?:[\\u{1F1E6}-\\u{1F1FF]{2}|[\\p{Extended_Pictographic}\\uFE0F\\u200D])+(?:\\s*)$/u;'
          good = 'const EMOJI_ONLY = /^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}|\\uFE0F|\\u200D|\\s)+$/u;'
          s = s.replace(bad, good)
          bad_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString(), body: "", sticker_key: null }).eq("id", message.id);'
          good_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString() }).eq("id", message.id);'
          s = s.replace(bad_delete, good_delete)
          s = s.replace('  ArrowLeft,\\n', '').replace('  Heart,\\n', '').replace('  Link2,\\n', '')
          s = s.replace('entries as Presence[]', 'entries as unknown as Presence[]')
          s = s.replace('const {data,e}', 'const {data,error:e}')
          old = 'if (!user.id) return <section className="surface-card p-6 text-sm text-[#aaa8ba]">Sign in to use MatchUp group chat.</section>;'
          new = 'if (!user.id) return <section className="surface-card p-6 text-sm text-[#aaa8ba]"><p>Sign in to use MatchUp group chat.</p><div className="mt-4 flex gap-3"><a href="/auth/sign-in" className="flex-1 rounded-xl bg-[#167bd1] px-4 py-3 text-center text-sm font-bold text-white">Sign In</a><a href="/auth/sign-up" className="flex-1 rounded-xl border border-[#167bd1] bg-transparent px-4 py-3 text-center text-sm font-bold text-[#70c1ff]">Sign Up</a></div></section>;'
          s = s.replace(old, new)
          s = s.replace('type Group = { id: string; name: string; created_by: string; created_at: string };', 'type Group = { id: string; name: string; created_by: string; created_at: string; kind?: "general" | "private" | "group"; locked?: boolean };')
          old_groups = 'const groupList = (memberships || []).map((row: { chat_groups?: Group | Group[] | null }) => normalizeGroup(row.chat_groups)).filter(Boolean) as Group[];'
          new_groups = 'const memberGroups = (memberships || []).map((row: { chat_groups?: Group | Group[] | null }) => normalizeGroup(row.chat_groups)).filter(Boolean) as Group[];\n    const { data: generalId } = await supabase.rpc("get_or_create_general_chat");\n    let generalGroup: Group | null = null;\n    if (generalId) { const { data: generalRow } = await supabase.from("chat_groups").select("id,name,created_by,created_at,kind,locked").eq("id", generalId).maybeSingle(); generalGroup = generalRow as Group | null; }\n    const groupList = generalGroup ? [generalGroup, ...memberGroups.filter((group) => group.id !== generalGroup!.id)] : memberGroups;'
          s = s.replace(old_groups, new_groups)
          anchor = '<button type="button" onClick={()=>setShowInvites(v=>!v)} className="icon-button relative" aria-label="Group invitations">'
          mute_button = '<button type="button" onClick={()=>void toggleMute()} className="icon-button" aria-label={muted ? "Unmute chat" : "Mute chat"}>{muted ? "🔔" : "🔕"}</button>'
          if 'aria-label={muted ? "Unmute chat" : "Mute chat"}' not in s:
              s = s.replace(anchor, mute_button + anchor)
          p.write_text(s)
          PY2
      - name: Add group limits, tournament launch and warm chat hooks
        shell: bash
        run: |
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          if 'groupLimit' not in s:
              s = s.replace('Settings2, Smile, Trash2', 'Settings2, Smile, Trophy, Trash2')
              s = s.replace('kind:"general"|"private"|"group";locked:boolean;image_path?:string|null', 'kind:"general"|"private"|"group";locked:boolean;member_limit?:number;image_path?:string|null')
              s = s.replace('const [groupImage,setGroupImage]=useState<File|null>(null);', 'const [groupImage,setGroupImage]=useState<File|null>(null);const [groupLimit,setGroupLimit]=useState(20);const [showLimitPicker,setShowLimitPicker]=useState(false);')
              s = s.replace('locked,image_path', 'locked,member_limit,image_path')
              s = s.replace('{p_name:groupName.trim(),p_friend_ids:selectedInvitees}', '{p_name:groupName.trim(),p_friend_ids:selectedInvitees,p_member_limit:groupLimit}')
              s = s.replace('const toggleLock=async()=>{', 'const setMemberLimit=async(limit:number)=>{if(!active||active.kind!=="group"||active.created_by!==user.id)return;const {error:e}=await supabase.rpc("set_chat_group_member_limit",{p_group_id:active.id,p_member_limit:limit});if(e){setError(e.message);return;}setActive({...active,member_limit:limit});setGroups(v=>v.map(g=>g.id===active.id?{...g,member_limit:limit}:g));setGroupLimit(limit);setShowLimitPicker(false);};\n const toggleLock=async()=>{')
              s = s.replace('<section className="relative min-h-[72vh]', '<section className="matchup-chat relative min-h-[72vh]')
              s = s.replace('<header className="border-b', '<header className="matchup-chat-header border-b')
              s = s.replace('<div className="flex-1 overflow-y-auto bg-[#061221]', '<div className="matchup-chat-body flex-1 overflow-y-auto bg-[#061221]')
              s = s.replace('<div className="border-t border-[#18365f] bg-[#08182b] p-3 sm:p-4">', '<div className="matchup-chat-composer border-t border-[#18365f] bg-[#08182b] p-3 sm:p-4">')
              s = s.replace('rounded-br-[7px] bg-[#126bc0]', 'matchup-chat-bubble-own rounded-br-[7px] bg-[#126bc0]')
              s = s.replace('rounded-bl-[7px] border border-[#173d67] bg-[#0a1b2f]', 'matchup-chat-bubble-other rounded-bl-[7px] border border-[#173d67] bg-[#0a1b2f]')
              s = s.replace('onClick={()=>{setGroupName(active.name);setInviteSearch("");setInviteCandidates(friends);setShowManage(v=>!v);}}', 'onClick={()=>{setGroupName(active.name);setInviteSearch("");setInviteCandidates(friends);setGroupLimit(active.member_limit||20);setShowManage(v=>!v);}}')
              create_anchor = '<div className="mt-4"><p className="mb-2 text-xs font-black uppercase tracking-[.14em] text-[#66809a]">Invite people</p>'
              limit_button = '<button type="button" onClick={()=>setShowLimitPicker(true)} className="mt-4 flex w-full items-center justify-between rounded-2xl border border-[#214a78] bg-[#071426] p-4 text-left"><span><strong className="block text-sm">Group limit</strong><small className="text-[11px] text-[#7892ac]">Choose how many people can be in this group</small></span><span className="rounded-full bg-[var(--accent-soft)] px-3 py-1 text-xs font-black text-[var(--accent)]">{groupLimit} people</span></button>'+create_anchor
              s = s.replace(create_anchor, limit_button)
              manage_anchor = '<div className="mt-5"><div className="mb-2 flex items-center justify-between"><p className="text-xs font-black uppercase tracking-[.14em] text-[#66809a]">Members · {members.length}</p></div>'
              manage_limit = '<button type="button" onClick={()=>{setGroupLimit(active.member_limit||20);setShowLimitPicker(true);}} className="mb-4 flex w-full items-center justify-between rounded-2xl border border-[#214a78] bg-[#071426] p-3 text-left"><span><strong className="block text-sm">Group limit</strong><small className="text-[11px] text-[#7892ac]">Members {members.length} · Limit {active.member_limit||20}</small></span><span className="text-xs font-black text-[var(--accent)]">Change</span></button>'+manage_anchor
              s = s.replace(manage_anchor, manage_limit)
              manage_tournament = '<button type="button" onClick={()=>{window.location.href=`/tournaments/from-group?groupId=${active.id}`;}} className="flex w-full items-center gap-3 rounded-2xl border border-[var(--line)] bg-[var(--accent-soft)] p-3 text-left"><Trophy size={18} className="text-[var(--accent)]"/><span><strong className="block text-sm">Create Tournament</strong><small className="text-[11px] text-[var(--muted)]">Invite people from this group before creating</small></span></button>'
              s = s.replace('<div className="mt-5 grid gap-3">', '<div className="mt-5 grid gap-3">'+manage_tournament)
              picker = '{showLimitPicker&&<div className="fixed inset-0 z-[95] grid place-items-center bg-black/75 p-4"><div className="w-full max-w-md rounded-[28px] border border-[var(--line)] bg-[#171109] p-5 shadow-2xl"><div className="flex items-center justify-between"><div><p className="text-[10px] font-black uppercase tracking-[.16em] text-[var(--accent)]">Group settings</p><h2 className="mt-1 text-xl font-black">Limit group size</h2></div><button type="button" onClick={()=>setShowLimitPicker(false)}><X size={19}/></button></div><p className="mt-2 text-xs text-[var(--muted)]">Once the group reaches this number, new invitations are blocked until the admin raises the limit.</p><div className="mt-5 grid grid-cols-2 gap-3">{[10,20,30,50].map(limit=><button key={limit} type="button" onClick={()=>{setGroupLimit(limit);if(showManage)void setMemberLimit(limit);}} className={`rounded-2xl border p-5 text-left ${groupLimit===limit?"border-[var(--accent)] bg-[var(--accent-soft)]":"border-[var(--line)] bg-[#100d09]"}`}><span className="block text-2xl font-black">{limit}</span><span className="text-xs text-[var(--muted)]">people</span></button>)}</div><button type="button" onClick={()=>{if(showManage)void setMemberLimit(groupLimit);else setShowLimitPicker(false);}} className="mt-5 w-full rounded-2xl bg-[var(--accent)] px-4 py-3 text-sm font-black text-[#241205]">Save limit</button></div></div>}'
              s = s.replace('</section>;\n}', picker+'</section>;\n}')
              p.write_text(s)
          PY2
      - name: Add guest live feed and General chat browsing
        shell: bash
        run: |
          python3 - <<'PY3'
          from pathlib import Path
          import re

          feed = Path('components/feeds/feeds-client.tsx')
          s = feed.read_text()
          start = s.find(' const load=useCallback(async()=>{')
          marker = '},[supabase]);'
          end = s.find(marker, start)
          if start >= 0 and end >= 0:
              end += len(marker)
              new_load = ''' const load=useCallback(async()=>{const {data:auth}=await supabase.auth.getUser();const currentUser=auth.user;setUserId(currentUser?.id||"");const {data:rows}=await supabase.from("posts").select("id,author_id,body,media_kind,video_duration_seconds,created_at").order("created_at",{ascending:false}).limit(100);const postRows=rows||[];const ids=postRows.map((r:any)=>r.id);if(!ids.length){setPosts([]);return;}const {data:media}=await supabase.from("post_media").select("post_id,storage_path,media_type,position").in("post_id",ids).order("position");const {data:likes}=await supabase.from("post_likes").select("post_id,user_id").in("post_id",ids);const {data:comments}=await supabase.from("post_comments").select("id,post_id,author_id,body,created_at").in("post_id",ids).order("created_at",{ascending:true});const {data:saves}=currentUser?await supabase.from("saved_posts").select("post_id,user_id").eq("user_id",currentUser.id).in("post_id",ids):{data:[]};const {data:follows}=await supabase.from("user_follows").select("following_id").eq("follower_id",currentUser?.id||"00000000-0000-0000-0000-000000000000");const authorIds=Array.from(new Set(postRows.map((r:any)=>r.author_id)));const commentAuthorIds=Array.from(new Set((comments||[]).map((r:any)=>r.author_id)));const allIds=Array.from(new Set([...authorIds,...commentAuthorIds]));const {data:profiles}=await supabase.from("profiles").select("id,display_name,username,avatar_path").in("id",allIds);const pMap=new Map((profiles||[]).map((p:any)=>[p.id,p]));const mMap=new Map<string,any[]>();(media||[]).forEach((m:any)=>{const list=mMap.get(m.post_id)||[];const {data:url}=supabase.storage.from("feed-media").getPublicUrl(m.storage_path);list.push({...m,url:url.publicUrl});mMap.set(m.post_id,list);});const liked=new Set(currentUser?(likes||[]).filter((l:any)=>l.user_id===currentUser.id).map((l:any)=>l.post_id):[]);const saved=new Set((saves||[]).map((x:any)=>x.post_id));const following=new Set(currentUser?(follows||[]).map((f:any)=>f.following_id):[]);const cMap=new Map<string,Comment[]>();(comments||[]).forEach((c:any)=>{const list=cMap.get(c.post_id)||[];const p=pMap.get(c.author_id);list.push({id:c.id,author:profileName(p),authorId:c.author_id,text:c.body,time:relativeTime(c.created_at),isOwn:currentUser?c.author_id===currentUser.id:false});cMap.set(c.post_id,list);});setPosts(postRows.map((r:any)=>{const p=pMap.get(r.author_id);const author:Author={id:r.author_id,name:profileName(p),handle:`@${p?.username||"player"}`,avatar:p?.avatar_path||null,initials:profileName(p).split(" ").map((x:string)=>x[0]).join("").slice(0,2).toUpperCase()};const mediaList=mMap.get(r.id)||[];const images=mediaList.filter(m=>m.media_type==="image").map(m=>m.url);const video=mediaList.find(m=>m.media_type==="video")?.url;return {id:r.id,author,time:relativeTime(r.created_at),caption:r.body,media:images.length?images:video?[video]:[],videoUrl:video,hasVideo:Boolean(video),likes:(likes||[]).filter((l:any)=>l.post_id===r.id).length,comments:(comments||[]).filter((c:any)=>c.post_id===r.id).length,commentList:cMap.get(r.id)||[],shares:0,liked:liked.has(r.id),saved:saved.has(r.id),following:following.has(r.author_id),isOwn:currentUser?r.author_id===currentUser.id:false,category:"community"};}));},[supabase]);'''
              s = s[:start] + new_load + s[end:]
          feed.write_text(s)

          chat = Path('components/chat/chat-hub.tsx')
          s = chat.read_text()
          old_guest_workspace = 'const loadWorkspace=useCallback(async()=>{const {data:auth}=await supabase.auth.getUser();if(!auth.user){setLoading(false);setError("Sign in to use MatchUp chat.");return;}'
          new_guest_workspace = 'const loadWorkspace=useCallback(async()=>{const {data:auth}=await supabase.auth.getUser();if(!auth.user){setUser({id:"",displayName:"Guest"});const {data:g}=await supabase.from("chat_groups").select("id,name,created_by,created_at,kind,locked,member_limit,image_path").eq("kind","general").maybeSingle();setGeneral(g as Group|null);setGroups([]);setPrivateChats([]);setFriends([]);setInvites([]);setInviteCandidates([]);setLoading(false);setError(g?"Sign in to send messages or interact in chat.":"General chat is not available yet.");if(g)setActive(g as Group);return;}'
          s = s.replace(old_guest_workspace, new_guest_workspace)
          s = s.replace('if(!active||!user.id)return;void loadGroup(active);', 'if(!active)return;void loadGroup(active);')
          s = s.replace('if(unread.length)await supabase.from("chat_message_reads").upsert', 'if(user.id&&unread.length)await supabase.from("chat_message_reads").upsert')
          s = s.replace('if(row.sender_id!==user.id)await supabase.from("chat_message_reads").upsert', 'if(user.id&&row.sender_id!==user.id)await supabase.from("chat_message_reads").upsert')
          s = s.replace('channel.subscribe(async status=>{if(status==="SUBSCRIBED")await channel.track({user_id:user.id,name:user.displayName,typing:false});});', 'channel.subscribe(async status=>{if(status==="SUBSCRIBED"&&user.id)await channel.track({user_id:user.id,name:user.displayName,typing:false});});')
          s = s.replace('const toggleReaction=useCallback(async(id:string,emoji:string)=>{const own=', 'const toggleReaction=useCallback(async(id:string,emoji:string)=>{if(!user.id)return;const own=')
          old_guest_return = 'if (!user.id) return <section className="surface-card p-6 text-sm text-[#aaa8ba]"><p>Sign in to use MatchUp group chat.</p><div className="mt-4 flex gap-3"><a href="/auth/sign-in" className="flex-1 rounded-xl bg-[#167bd1] px-4 py-3 text-center text-sm font-bold text-white">Sign In</a><a href="/auth/sign-up" className="flex-1 rounded-xl border border-[#167bd1] bg-transparent px-4 py-3 text-center text-sm font-bold text-[#70c1ff]">Sign Up</a></div></section>;'
          s = s.replace(old_guest_return, 'if (!user.id && !general) return <section className="surface-card p-6 text-sm text-[#aaa8ba]"><p>General chat is not available yet.</p><div className="mt-4 flex gap-3"><a href="/auth" className="flex-1 rounded-xl bg-[var(--accent)] px-4 py-3 text-center text-sm font-bold text-[#241205]">Sign In</a></div></section>;')
          chat.write_text(s)
          PY3
      - run: npm ci
      - run: NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder npm run build
      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet -- components/chat/chat-hub.tsx components/feeds/feeds-client.tsx; then
            echo 'No automated source fix was needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add components/chat/chat-hub.tsx components/feeds/feeds-client.tsx
            git commit -m 'ci: enable guest live browsing for feeds and general chat'
            git push origin main
          fi
          echo 'Final MatchUp guest browsing and production verification build.'
