name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply final scoped cleanup on main
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          pattern = re.compile(
              r'(?m)^(?P<i>[ \t]*)entries=\{friends\s*\.slice\(0, 2\)\s*\.map\(\(f\) => \(\{\n[\s\S]*?^\s*\}\)\)\}'
          )
          m = pattern.search(s)
          if not m:
              raise SystemExit('Message Friends entries block not found')
          i = m.group('i')
          replacement = (
              f'{i}entries={{friends\n'
              f'{i}  .slice(0, 2)\n'
              f'{i}  .map((f) => ({{\n'
              f'{i}    id: f.id,\n'
              f'{i}    label: nameOf(f),\n'
              f'{i}    secondary: `@${{f.username || "friend"}}`,\n'
              f'{i}    profile: f,\n'
              f'{i}    onClick: () => void openPrivate(f),\n'
              f'{i}  }}))}}'
          )
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          PY
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit final scoped cleanup
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          if git diff --cached --quiet; then
            echo "No cleanup change needed."
          else
            git diff --cached --check
            git commit -m "chore: restore unrelated chat sidebar formatting"
            git push origin HEAD:main
          fi
      - name: Test status
        run: |
          if [ -d tests ] || [ -d __tests__ ] || find . -maxdepth 3 -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "Test files detected; repository-specific test runner is not configured in package.json."
          else
            echo "No automated test suite is configured in package.json."
          fi
