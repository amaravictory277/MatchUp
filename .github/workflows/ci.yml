name: Build

on:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply scoped cleanup to main
        run: |
          git fetch origin main
          git checkout main
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)entries=\{friends\s*\.slice\(0, 2\)\s*\.map\(\(f\) => \(\{\n[\s\S]*?^\s*\}\)\)\}'
          )
          match = pattern.search(s)
          if not match:
              raise SystemExit('Message Friends entries block not found')
          indent = match.group('indent')
          replacement = (
              f'{indent}entries={{friends\n'
              f'{indent}  .slice(0, 2)\n'
              f'{indent}  .map((f) => ({{\n'
              f'{indent}    id: f.id,\n'
              f'{indent}    label: nameOf(f),\n'
              f'{indent}    secondary: `@${{f.username || "friend"}}`,\n'
              f'{indent}    profile: f,\n'
              f'{indent}    onClick: () => void openPrivate(f),\n'
              f'{indent}  }}))}}'
          )
          s = s[:match.start()] + replacement + s[match.end():]
          p.write_text(s)
          PY
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit scoped cleanup to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git diff --cached --check
          git commit -m "chore: restore unrelated chat sidebar formatting"
          git push origin HEAD:main
