name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore unrelated chat sidebar formatting
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          git checkout main
          python - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          old = '''              entries={friends.slice(0, 2).map((f) => ({
                id: f.id,
                label: nameOf(f),
                secondary: `@${f.username || "friend"}`,
                profile: f,
                onClick: () => void openPrivate(f),
              }))}'''
          new = '''              entries={friends
                .slice(0, 2)
                .map((f) => ({
                  id: f.id,
                  label: nameOf(f),
                  secondary: `@${f.username || "friend"}`,
                  profile: f,
                  onClick: () => void openPrivate(f),
                }))}'''
          if old not in s:
              raise SystemExit('Unrelated sidebar formatting is already restored or not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit scoped cleanup
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          if git diff --cached --quiet; then
            echo "No cleanup change needed."
          else
            git diff --cached --check
            git commit -m "chore: restore unrelated chat sidebar formatting"
            git push origin HEAD:main
          fi
      - name: Test status
        run: |
          if [ -d tests ] || [ -d __tests__ ] || find . -maxdepth 3 -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "Test files detected; repository-specific test runner is not configured in package.json."
          else
            echo "No automated test suite is configured in package.json."
          fi
