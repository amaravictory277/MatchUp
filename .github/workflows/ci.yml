name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Normalize generated source before build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path('components/chat/chat-hub.tsx'),
              Path('components/home/live-football-feature.tsx'),
              Path('components/match/match-room.tsx'),
              Path('lib/football/server.ts'),
          ]

          for p in files:
              if not p.exists():
                  continue
              s = p.read_text()
              s = s.replace(r'\`', '`').replace(r'\${', '${')
              p.write_text(s)

          p = Path('components/chat/chat-hub.tsx')
          if p.exists():
              s = p.read_text()
              bad = 'const EMOJI_ONLY = /^(?:[\\u{1F1E6}-\\u{1F1FF]{2}|[\\p{Extended_Pictographic}\\uFE0F\\u200D])+(?:\\s*)$/u;'
              good = 'const EMOJI_ONLY = /^(?:\\p{Extended_Pictographic}|\\p{Emoji_Presentation}|\\uFE0F|\\u200D|\\s)+$/u;'
              s = s.replace(bad, good)
              bad_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString(), body: "", sticker_key: null }).eq("id", message.id);'
              good_delete = 'const { error: deleteError } = await supabase.from("chat_messages").update({ deleted_at: new Date().toISOString() }).eq("id", message.id);'
              s = s.replace(bad_delete, good_delete)
              s = s.replace('  ArrowLeft,\n', '').replace('  Heart,\n', '').replace('  Link2,\n', '')
              p.write_text(s)

          p = Path('lib/football/server.ts')
          if p.exists():
              s = p.read_text()
              s = s.replace(r'replace(/\\/$/, "")', r'replace(/\/$/, "")')
              p.write_text(s)
          PY
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      - name: Commit source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No automated source fix was needed.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add components/chat/chat-hub.tsx components/home/live-football-feature.tsx components/match/match-room.tsx lib/football/server.ts
            git commit -m 'fix: normalize generated TypeScript source'
            git push origin main
          fi
