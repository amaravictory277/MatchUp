name: Build

on:
  push:
    branches: [main]
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply scoped chat bubble change on main
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/apply-chat-bubble')
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          old_class = 'className={`rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3 transition'
          new_class = 'className={`relative rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3.5 transition'
          if old_class in s:
              s = s.replace(old_class, new_class, 1)
          elif new_class not in s:
              raise SystemExit('Outgoing bubble class not found')
          old_status = '''                        <div className="mt-1 flex items-center justify-end gap-2">
                          <span className="text-[9px] text-white/50">
                            {timeOf(m.created_at)}
                          </span>
                          {!m.pending ? (
                            <span
                              className={`grid size-5 place-items-center rounded-full border ${read ? "border-white bg-white" : "border-white/25 bg-transparent"}`}
                              aria-label={read ? "Read" : "Delivered"}
                            >
                              {read ? (
                                <CheckCheck
                                  size={11}
                                  className="text-[#126bc0]"
                                />
                              ) : (
                                <CheckCheck
                                  size={11}
                                  className="text-white/45"
                                />
                              )}
                            </span>
                          ) : (
                            <span
                              className="grid size-5 place-items-center rounded-full border border-white/25"
                              aria-label="Sent"
                            >
                              <Check size={11} className="text-white/45" />
                            </span>
                          )}
                        </div>'''
          new_time = '''                        <div className="mt-1 flex items-center justify-end">
                          <span className="text-[9px] text-white/50">
                            {timeOf(m.created_at)}
                          </span>
                        </div>'''
          if old_status not in s:
              raise SystemExit('Outgoing status row not found')
          s = s.replace(old_status, new_time, 1)
          boundary = '''                        </div>
                        <div className="mt-1 flex items-center justify-end">'''
          status = '''                        {!m.pending ? (
                          <span
                            className={`absolute -right-2 bottom-0.5 grid size-4 place-items-center rounded-full border ${read ? "border-white bg-white" : "border-white/25 bg-transparent"}`}
                            aria-label={read ? "Read" : "Delivered"}
                          >
                            {read ? (
                              <CheckCheck size={9} className="text-[#126bc0]" />
                            ) : (
                              <CheckCheck size={9} className="text-white/45" />
                            )}
                          </span>
                        ) : (
                          <span
                            className="absolute -right-2 bottom-0.5 grid size-4 place-items-center rounded-full border border-white/25"
                            aria-label="Sent"
                          >
                            <Check size={9} className="text-white/45" />
                          </span>
                        )}
                        <div className="mt-1 flex items-center justify-end">'''
          if boundary not in s:
              raise SystemExit('Outgoing bubble/time boundary not found')
          s = s.replace(boundary, status, 1)
          p.write_text(s)
          PY
          npx prettier@3.6.2 --write components/chat/chat-hub.tsx
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit scoped source change
        if: github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/apply-chat-bubble')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No chat bubble source change needed."
          else
            git commit -m "fix: align chat bubble padding and check mark"
            git push origin HEAD:main
          fi
      - name: Test status
        run: |
          if [ -d tests ] || [ -d __tests__ ] || find . -maxdepth 3 -type f \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) | grep -q .; then
            echo "Test files detected; repository-specific test runner is not configured in package.json."
          else
            echo "No automated test suite is configured in package.json."
          fi
