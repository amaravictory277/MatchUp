name: Chat Cleanup Verify

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore only unrelated sidebar formatting on main
        run: |
          git fetch origin main
          git checkout main
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          pattern = re.compile(r'(?m)^(?P<i>[ \t]*)entries=\{friends\s*\.slice\(0, 2\)\s*\.map\(\(f\) => \(\{\n[\s\S]*?^\s*\}\)\)\}')
          m = pattern.search(s)
          if not m:
              raise SystemExit('Message Friends entries block not found')
          i = m.group('i')
          replacement = f'''{i}entries={{friends\n{i}  .slice(0, 2)\n{i}  .map((f) => ({{\n{i}    id: f.id,\n{i}    label: nameOf(f),\n{i}    secondary: `@${{f.username || "friend"}}`,\n{i}    profile: f,\n{i}    onClick: () => void openPrivate(f),\n{i}  }}))}}'''
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          PY
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build
      - name: Commit cleanup to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No cleanup needed."
          else
            git commit -m "chore: restore unrelated chat sidebar formatting"
            git push origin HEAD:main
          fi
