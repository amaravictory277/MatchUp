name: Temporary chat action order patch
on:
  push:
    paths:
      - '.github/workflows/patch-chat-actions.yml'

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch actual ChatHub caller order
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          old = 'primaryLabel="Add Friends" secondaryLabel="Message Friends" onPrimary={()=>window.location.assign("/friends")} onSecondary={()=>window.location.assign("/message-friends?tab=friends")} '
          new = 'primaryLabel="Message Friends" secondaryLabel="Add Friends" onPrimary={()=>window.location.assign("/message-friends?tab=friends")} onSecondary={()=>window.location.assign("/friends")} '
          if old not in s:
              raise SystemExit('Friends action pattern not found')
          s = s.replace(old, new, 1)
          old = 'primaryLabel="Create Group" secondaryLabel="View Groups" onPrimary={()=>{setInviteSearch("");setInviteCandidates(friends);setShowCreate(true);setShowRooms(false);}} onSecondary={()=>window.location.assign("/groups")} '
          new = 'primaryLabel="View Groups" secondaryLabel="Create Group" onPrimary={()=>window.location.assign("/groups")} onSecondary={()=>{setInviteSearch("");setInviteCandidates(friends);setShowCreate(true);setShowRooms(false);}} '
          if old not in s:
              raise SystemExit('Groups action pattern not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          git commit -m 'Fix chat action button order' || exit 0
          git push
