name: Fix ChatHub JSX

on:
  workflow_dispatch:
  push:
    paths:
      - components/chat/chat-hub.tsx
      - .github/workflows/fix-chat-hub-syntax.yml

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair the actual broken JSX conditional
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          prefix_old = '{messages.length?messages.map(m=>{'
          prefix_new = '{messages.length?<>{messages.map(m=>{'
          if s.count(prefix_old) != 1:
              raise SystemExit(f'Expected exactly one messages.length prefix, found {s.count(prefix_old)}')
          s = s.replace(prefix_old, prefix_new, 1)
          old = '})<div className="grid min-h-[45vh] place-items-center text-center"><div><div className="mx-auto grid size-16 place-items-center rounded-3xl bg-[#0b3154] text-[#70c1ff]"><Users size={28}/></div><h2 className="mt-4 text-lg font-black">{active?.kind==="general"?"Welcome to General":"No messages yet"}</h2><p className="mt-2 text-sm text-[#7892ac]">Send a real message. It will persist and appear here in realtime.</p></div></div>}'
          new = '})}</>:<div className="grid min-h-[45vh] place-items-center text-center"><div><div className="mx-auto grid size-16 place-items-center rounded-3xl bg-[#0b3154] text-[#70c1ff]"><Users size={28}/></div><h2 className="mt-4 text-lg font-black">{active?.kind==="general"?"Welcome to General":"No messages yet"}</h2><p className="mt-2 text-sm text-[#7892ac]">Send a real message. It will persist and appear here in realtime.</p></div></div>}'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one broken messages.length ending, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Reformat ChatHub JSX
        run: npx --yes prettier@3.6.2 --write components/chat/chat-hub.tsx

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          npm run build 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            cp /tmp/build.log chat-hub-build-error.txt
            python3 - <<'PY'
            import base64, json, os, urllib.request
            from pathlib import Path
            token = os.environ['GITHUB_TOKEN']
            repo = os.environ['GITHUB_REPOSITORY']
            name = 'chat-hub-build-error.txt'
            data = base64.b64encode(Path(name).read_bytes()).decode()
            url = f'https://api.github.com/repos/{repo}/contents/{name}'
            req = urllib.request.Request(url, method='PUT', data=json.dumps({
                'message': 'debug: publish ChatHub build output',
                'content': data,
                'branch': 'main'
            }).encode(), headers={
                'Authorization': f'Bearer {token}',
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
                'Content-Type': 'application/json'
            })
            with urllib.request.urlopen(req) as r:
                print(r.status)
            PY
            exit "$rc"
          fi

      - name: Show diff and commit only ChatHub
        shell: bash
        run: |
          git diff -- components/chat/chat-hub.tsx
          git status --short
          git diff --check
          if git diff --quiet -- components/chat/chat-hub.tsx; then
            echo 'No ChatHub changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          git commit -m 'fix: repair and format ChatHub JSX'
          git push origin main
