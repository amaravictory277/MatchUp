name: rollback hamburger sidebar
on:
  push:
    branches: [main]

jobs:
  rollback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore sidebar layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess

          path = Path('components/chat/chat-hub.tsx')
          text = path.read_text()
          old = subprocess.check_output([
              'git', 'show', 'ee9bf509376d32b7213dc6f96fda5d753fa819f8:components/chat/chat-hub.tsx'
          ], text=True)

          old_sidebar_match = re.search(r'\{showRooms\?<aside[\s\S]*?</aside>:null\}', old)
          if not old_sidebar_match:
              raise SystemExit('Could not find the previous hamburger sidebar in Git history')
          old_sidebar = old_sidebar_match.group(0)

          # The current revision incorrectly renders these cards in the main chat area.
          cards_pattern = r'\n <SidebarSectionCard title="MESSAGE FRIENDS"[\s\S]*?emptyText="No groups yet\."/>\n'
          text, removed = re.subn(cards_pattern, '\n', text, count=1)
          if removed != 1:
              raise SystemExit('Could not find the main-chat Message Friends/My Groups cards')

          # Put the exact previous sidebar back after the chat header, leaving the
          # current conversation header/body/composer implementation untouched.
          if '{showRooms?<aside' in text:
              text = re.sub(r'\{showRooms\?<aside[\s\S]*?</aside>:null\}', old_sidebar, text, count=1)
          else:
              marker = '</header>\n'
              if marker not in text:
                  raise SystemExit('Could not find the chat header insertion point')
              text = text.replace(marker, marker + old_sidebar + '\n', 1)

          path.write_text(text)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(chat): restore previous hamburger sidebar'
          git push
