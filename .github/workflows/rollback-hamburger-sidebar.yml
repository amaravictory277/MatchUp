name: rollback hamburger sidebar
on:
  workflow_dispatch:

jobs:
  rollback:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore sidebar layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('components/chat/chat-hub.tsx')
          text = path.read_text()

          old_cards = ''' <SidebarSectionCard title="MESSAGE FRIENDS" description="Connect with your friends and start a conversation." entries={friends.slice(0,2).map(f=>({id:f.id,label:nameOf(f),secondary:`@${f.username||"friend"}`,profile:f,onClick:()=>void openPrivate(f)}))} primaryLabel="Message Friends" secondaryLabel="Add Friends" onPrimary={()=>window.location.assign("/message-friends?tab=friends")} onSecondary={()=>window.location.assign("/friends")} emptyText="No friends available yet."/><SidebarSectionCard title="MY GROUPS" description="Keep your groups close and jump back into the conversations that matter." entries={groups.slice(0,2).map(g=>({id:g.id,label:g.name,secondary:g.locked?"Locked group":"Group",group:true,onClick:()=>{setActive(g);setShowRooms(false);}}))} primaryLabel="View Groups" secondaryLabel="Create Group" onPrimary={()=>window.location.assign("/groups")} onSecondary={()=>{setInviteSearch("");setInviteCandidates(friends);setShowCreate(true);setShowRooms(false);}} emptyText="No groups yet."/>\n'''
          if old_cards not in text:
              raise SystemExit('Expected main-area sidebar cards block was not found')
          text = text.replace(old_cards, '', 1)

          sidebar = ''' {showRooms?<aside className="fixed inset-0 z-[60] flex h-[100dvh] w-full flex-col overflow-y-auto border-[#18365f] bg-[#08182b] p-4 shadow-2xl sm:absolute sm:inset-x-0 sm:top-[73px] sm:z-30 sm:h-auto sm:max-h-[calc(72vh-73px)] sm:w-auto sm:border-b"><div className="mb-4 flex items-center justify-between"><p className="text-xs font-black uppercase tracking-[.14em] text-[#47a8ff]">Chats & Groups</p><button type="button" onClick={()=>setShowRooms(false)}><X size={17}/></button></div><button type="button" onClick={()=>{if(general){setActive(general);setShowRooms(false);}}} className={`mb-1 flex w-full items-center gap-3 rounded-2xl p-3 text-left ${active?.kind==="general"?"bg-[#0b3154]":"hover:bg-[#0a1d32]"}`}><span className="grid size-10 place-items-center rounded-xl bg-[#126bc0]"><Users size={18}/></span><span className="min-w-0 flex-1"><strong className="block text-sm">General</strong><small className="text-[11px] text-[#7892ac]">Global MatchUp chat</small></span></button><SidebarSectionCard title="MESSAGE FRIENDS" description="Connect with your friends and start a conversation." entries={friends.slice(0,2).map(f=>({id:f.id,label:nameOf(f),secondary:`@${f.username||"friend"}`,profile:f,onClick:()=>void openPrivate(f)}))} primaryLabel="Message Friends" secondaryLabel="Add Friends" onPrimary={()=>window.location.assign("/message-friends?tab=friends")} onSecondary={()=>window.location.assign("/friends")} emptyText="No friends available yet."/><SidebarSectionCard title="MY GROUPS" description="Keep your groups close and jump back into the conversations that matter." entries={groups.slice(0,2).map(g=>({id:g.id,label:g.name,secondary:g.locked?"Locked group":"Group",group:true,onClick:()=>{setActive(g);setShowRooms(false);}}))} primaryLabel="View Groups" secondaryLabel="Create Group" onPrimary={()=>window.location.assign("/groups")} onSecondary={()=>{setInviteSearch("");setInviteCandidates(friends);setShowCreate(true);setShowRooms(false);}} emptyText="No groups yet."/></aside>:null}\n'''
          pattern = r' \{showRooms\?<aside[\s\S]*?</aside>:null\}\n'
          text2, count = re.subn(pattern, sidebar, text, count=1)
          if count != 1:
              raise SystemExit('Expected hamburger sidebar block was not found')
          path.write_text(text2)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/chat/chat-hub.tsx
          git commit -m 'fix(chat): restore screenshot sidebar structure'
          git push
