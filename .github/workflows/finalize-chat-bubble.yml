name: Finalize Chat Bubble

on:
  push:
    paths:
      - .chat-bubble-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final scoped markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('components/chat/chat-hub.tsx')
          s = p.read_text()
          s = s.replace(
              'className={`rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3 transition',
              'className={`relative rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3.5 transition',
          )
          s = s.replace(
              'className={`relative rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3 transition',
              'className={`relative rounded-[22px] rounded-br-[7px] bg-[#126bc0] px-4 py-3.5 transition',
          )
          bubble_open = r'(?P<open>\s*<div\n\s*className={`relative rounded-\[22px\] rounded-br-\[7px\] bg-\[#126bc0\] px-4 py-3\.5 transition[^\n]*`}\n\s*>)'
          pattern = re.compile(
              bubble_open +
              r'(?P<body>[\s\S]*?)\n\s*</div>\n'
              r'\s*<div className="mt-1 flex items-center justify-end(?: gap-2)?">[\s\S]*?\n\s*</div>'
          )
          m = pattern.search(s)
          if not m:
              raise SystemExit('Could not locate outgoing bubble + status row')
          status = '''
                          {!m.pending ? (
                            <span
                              className={`absolute -right-2 bottom-0.5 grid size-4 place-items-center rounded-full border ${read ? "border-white bg-white" : "border-white/25 bg-transparent"}`}
                              aria-label={read ? "Read" : "Delivered"}
                            >
                              {read ? (
                                <CheckCheck size={9} className="text-[#126bc0]" />
                              ) : (
                                <CheckCheck size={9} className="text-white/45" />
                              )}
                            </span>
                          ) : (
                            <span
                              className="absolute -right-2 bottom-0.5 grid size-4 place-items-center rounded-full border border-white/25"
                              aria-label="Sent"
                            >
                              <Check size={9} className="text-white/45" />
                            </span>
                          )}'''
          time_row = '''
                        <div className="mt-1 flex items-center justify-end">
                          <span className="text-[9px] text-white/50">
                            {timeOf(m.created_at)}
                          </span>
                        </div>'''
          replacement = m.group('open') + m.group('body') + status + '\n                        </div>' + time_row
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          PY
          npx prettier@3.6.2 --write components/chat/chat-hub.tsx
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npm run build
      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/chat/chat-hub.tsx
          git diff --cached --check
          git commit -m "fix: align chat bubble padding and check mark"
          git push
