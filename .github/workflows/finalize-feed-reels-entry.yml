name: Finalize feed Reels entry

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'matchup-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve feed URL state before Reels navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('components/feeds/feeds-client.tsx');s=p.read_text()
          old='onLongPressVideo={id=>{const params=new URLSearchParams({tab,q:query,post:id,scroll:String(Math.round(window.scrollY))});router.push(`/reels?${params.toString()}`);}}'
          new='onLongPressVideo={id=>{const params=new URLSearchParams({tab,q:query,post:id,scroll:String(Math.round(window.scrollY))});window.history.replaceState(window.history.state,"",`/feeds?${params.toString()}`);router.push(`/reels?${params.toString()}`);}}'
          if old not in s: raise SystemExit('Reels entry anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git rm .github/workflows/finalize-feed-reels-entry.yml
          git config user.name "matchup-bot"
          git config user.email "actions@github.com"
          git add components/feeds/feeds-client.tsx
          git commit -m "fix: preserve feed state when entering reels"
          git push
